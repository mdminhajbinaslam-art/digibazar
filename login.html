<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DigiBazar Login</title>

<style>
body{
  font-family:Arial;
  background:#f2f2f2;
  text-align:center;
  padding-top:100px;
}

.box{
  background:white;
  padding:20px;
  margin:20px;
  border-radius:10px;
}

input{
  width:90%;
  padding:10px;
  margin:10px 0;
}

button{
  background:green;
  color:white;
  border:none;
  padding:10px;
  width:95%;
}
</style>
</head>

<body>

<div class="box">
  <h2>DigiBazar Login</h2>

  <input type="text" id="user" placeholder="নাম লিখুন">
  <input type="password" id="pass" placeholder="পাসওয়ার্ড লিখুন">

  <button onclick="login()">লগইন</button>
</div>

<script>
function login(){
  let user = document.getElementById("user").value;

  if(user == ""){
    alert("নাম লিখুন");
  } else {
    alert("স্বাগতম " + user + " 👍");
    window.location.href = "index.html";
  }
}
</script>

</body>
</html>
