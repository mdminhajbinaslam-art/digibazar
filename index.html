<!DOCTYPE html>
<html>
<head>
  <title>DigiBazar Full Marketplace</title>
</head>

<body>

<h1>🛒 DigiBazar Multi-Vendor Marketplace</h1>

<!-- AUTH -->
<div id="auth">

<h2>Register / Login</h2>

<input id="email" placeholder="Email"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>

</div>

<!-- SHOP -->
<div id="shop" style="display:none;">

<h2>🛒 Shop Panel</h2>

<button onclick="logout()">Logout</button>

<hr>

<!-- SEARCH -->
<input id="search" placeholder="Search product..." onkeyup="loadProducts()">
<br><br>

<h3>➕ Add Product</h3>

<input id="name" placeholder="Product Name"><br><br>
<input id="price" placeholder="Price"><br><br>
<input id="category" placeholder="Category"><br><br>
<input type="file" id="image"><br><br>

<button onclick="addProduct()">Post Product</button>

<hr>

<h3>📦 Products</h3>
<div id="productList"></div>

<hr>

<h3>🛒 Cart + Payment</h3>

<select id="paymentMethod">
  <option value="cod">Cash on Delivery</option>
  <option value="bkash">bKash</option>
  <option value="nagad">Nagad</option>
</select>

<br><br>

<button onclick="placeOrder()">Place Order</button>

<hr>

<h3>📦 Orders (Admin Panel)</h3>
<div id="orderList"></div>

<hr>

<h3>👨‍💼 Seller Dashboard</h3>

<button onclick="loadMyProducts()">My Products</button>

<div id="myProducts"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
doc,
updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import {
getStorage,
ref,
uploadBytes,
getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

// CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyBFRzWWY0iTPnPtmT_io6NNmxvmE9SZPwE",
  authDomain: "digibazar-48743.firebaseapp.com",
  projectId: "digibazar-48743",
  storageBucket: "digibazar-48743.firebasestorage.app",
  messagingSenderId: "295224613021",
  appId: "1:295224613021:web:4c1b41da57cb240c165c74"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

let cart = [];

// REGISTER
window.register = function(){

createUserWithEmailAndPassword(auth,emailInput(),passInput())
.then(()=>{
openShop();
loadProducts();
loadOrders();
})
.catch(e=>alert(e.message));

}

// LOGIN
window.login = function(){

signInWithEmailAndPassword(auth,emailInput(),passInput())
.then(()=>{
openShop();
loadProducts();
loadOrders();
})
.catch(e=>alert(e.message));

}

// LOGOUT
window.logout = function(){

signOut(auth);

document.getElementById("auth").style.display="block";
document.getElementById("shop").style.display="none";

}

// ADD PRODUCT
window.addProduct = async function(){

let name = document.getElementById("name").value;
let price = document.getElementById("price").value;
let category = document.getElementById("category").value;
let file = document.getElementById("image").files[0];

let imgRef = ref(storage,"products/"+file.name);

await uploadBytes(imgRef,file);

let imgUrl = await getDownloadURL(imgRef);

await addDoc(collection(db,"products"),{
name,
price,
category,
image: imgUrl,
seller: auth.currentUser.email,
rating: 0
});

loadProducts();

}

// PRODUCTS
window.loadProducts = async function(){

const snap = await getDocs(collection(db,"products"));

let search = document.getElementById("search")?.value || "";
search = search.toLowerCase();

let html = "";

snap.forEach(docItem=>{

let d = docItem.data();

if(d.name.toLowerCase().includes(search) || d.category.toLowerCase().includes(search)){

html += `
<div style="border:1px solid #ccc;padding:10px;margin:10px;">

<img src="${d.image}" width="120"><br>

🛍️ ${d.name}<br>
📂 ${d.category}<br>
💰 ${d.price}<br>
⭐ Rating: ${d.rating}<br>
👨‍💼 Seller: ${d.seller}<br><br>

<button onclick="addToCart('${d.name}','${d.price}')">
🛒 Add to Cart
</button>

<br><br>

<button onclick="rateProduct('${docItem.id}',5)">
⭐ Give 5 Star
</button>

</div>
`;

}

});

document.getElementById("productList").innerHTML = html;

}

// ⭐ RATE PRODUCT
window.rateProduct = async function(id,rating){

await updateDoc(doc(db,"products",id),{
rating: rating
});

alert("Thanks for rating ⭐");

loadProducts();

}

// CART
window.addToCart = function(name,price){

cart.push({name,price});

alert("Added ✔");

}

// PLACE ORDER
window.placeOrder = async function(){

let method = document.getElementById("paymentMethod").value;

for(let item of cart){

await addDoc(collection(db,"orders"),{
product:item.name,
price:item.price,
payment:method,
email:auth.currentUser.email,
status:"Pending"
});

}

cart = [];

alert("Order placed ✔");

loadOrders();

}

// LOAD ORDERS
window.loadOrders = async function(){

const snap = await getDocs(collection(db,"orders"));

let html = "";

snap.forEach(d=>{

let data = d.data();

html += `
<div style="border:1px solid red;padding:10px;margin:10px;">

🛍️ ${data.product}<br>
💰 ${data.price}<br>
💳 ${data.payment}<br>
📧 ${data.email}<br>
📦 Status: <b>${data.status}</b><br><br>

<button onclick="updateStatus('${d.id}','Processing')">
Processing
</button>

<button onclick="updateStatus('${d.id}','Delivered')">
Delivered
</button>

</div>
`;

});

document.getElementById("orderList").innerHTML = html;

}

// UPDATE STATUS
window.updateStatus = async function(id,status){

await updateDoc(doc(db,"orders",id),{
status:status
});

loadOrders();

}

// SELLER DASHBOARD
window.loadMyProducts = async function(){

const snap = await getDocs(collection(db,"products"));

let html = "";

snap.forEach(docItem=>{

let d = docItem.data();

if(d.seller === auth.currentUser.email){

html += `
<div style="border:2px solid green;padding:10px;margin:10px;">

<img src="${d.image}" width="120"><br>

🛍️ ${d.name}<br>
💰 ${d.price}<br>
📂 ${d.category}<br>
⭐ ${d.rating}<br>

<b>My Product</b>

</div>
`;

}

});

document.getElementById("myProducts").innerHTML = html;

}

// HELPERS
function emailInput(){
return document.getElementById("email").value;
}

function passInput(){
return document.getElementById("password").value;
}

function openShop(){

document.getElementById("auth").style.display="none";
document.getElementById("shop").style.display="block";

}

</script>

</body>
</html>
