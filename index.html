<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DigiBazar</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
}

.header{
background:green;
color:white;
padding:15px;
font-size:25px;
font-weight:bold;
text-align:center;
}

.banner{
background:url('https://picsum.photos/800/300');
height:200px;
background-size:cover;
background-position:center;
}

.search{
padding:10px;
text-align:center;
background:white;
}

.search input{
width:90%;
padding:10px;
border-radius:5px;
border:1px solid #ccc;
}

.products{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
padding:10px;
}

.card{
background:white;
padding:10px;
border-radius:10px;
text-align:center;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.card img{
width:100%;
height:120px;
border-radius:10px;
object-fit:cover;
}

.price{
color:green;
font-weight:bold;
}

button{
background:green;
color:white;
border:none;
padding:10px;
width:100%;
border-radius:5px;
margin-top:5px;
}

.footer{
background:black;
color:white;
text-align:center;
padding:10px;
margin-top:10px;
}

</style>
</head>

<body>

<div class="header">
DigiBazar 🛒
</div>

<div class="banner"></div>

<div class="search">
<input type="text" placeholder="পণ্য খুঁজুন...">
</div>

<div class="products">

<div class="card">
<img src="https://picsum.photos/200?1">
<h3>মোবাইল</h3>
<p class="price">৳ 12000</p>
<button onclick="buy()">কিনুন</button>
</div>

<div class="card">
<img src="https://picsum.photos/200?2">
<h3>ঘড়ি</h3>
<p class="price">৳ 1500</p>
<button onclick="buy()">কিনুন</button>
</div>

<div class="card">
<img src="https://picsum.photos/200?3">
<h3>জুতা</h3>
<p class="price">৳ 2000</p>
<button onclick="buy()">কিনুন</button>
</div>

<div class="card">
<img src="https://picsum.photos/200?4">
<h3>ব্যাগ</h3>
<p class="price">৳ 800</p>
<button onclick="buy()">কিনুন</button>
</div>

</div>

<div class="footer">
© 2026 DigiBazar
</div>

<script>

function buy(){
alert("আপনি পণ্য কিনতে চান 👍");
}
</script>
</body>
</html>
