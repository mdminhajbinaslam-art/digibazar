 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DigiBazar Fixed System</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
padding:15px;
padding-bottom:100px;
}

h1,h2,h3{color:#222;}

input,button,select{
width:100%;
padding:10px;
margin:5px 0;
border-radius:8px;
border:1px solid #ccc;
}

button{
background:#0d6efd;
color:white;
border:none;
cursor:pointer;
}

.card{
background:white;
padding:15px;
margin:10px 0;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

img{max-width:120px;border-radius:8px;}

</style>

</head>

<body>

<h1>🏪 DigiBazar</h1>

<!-- AUTH -->

<div id="auth">

<h2>Login / Register</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>

</div>

<!-- SHOP -->

<div id="shop" style="display:none;">

<button onclick="logout()">Logout</button>

<hr>

<h3>📦 Products</h3>
<div id="productList"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
getFirestore,
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyBFRzWWY0iTPnPtmT_io6NNmxvmE9SZPwE",
authDomain:"digibazar-48743.firebaseapp.com",
projectId:"digibazar-48743"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ======================
AUTH FIX (MAIN PART)
====================== */

window.register = async function(){

try{

await createUserWithEmailAndPassword(
auth,
email.value,
password.value
);

}catch(e){
alert(e.message);
}

};

window.login = async function(){

try{

await signInWithEmailAndPassword(
auth,
email.value,
password.value
);

}catch(e){
alert(e.message);
}

};

window.logout = function(){
signOut(auth);
};

/* ======================
AUTO LOGIN FIX (IMPORTANT)
====================== */

onAuthStateChanged(auth,(user)=>{

if(user){

document.getElementById("auth").style.display="none";
document.getElementById("shop").style.display="block";

loadProducts();

}else{

document.getElementById("auth").style.display="block";
document.getElementById("shop").style.display="none";

}

});

/* ======================
PRODUCT LOAD
====================== */

window.loadProducts = async function(){

let snap = await getDocs(collection(db,"products"));

let html = "";

snap.forEach(d=>{

let x = d.data();

html += `
<div class="card">

${x.name}<br>
${x.price}<br>
${x.category}

</div>
`;

});

document.getElementById("productList").innerHTML = html;

};

</script>

</body>
</html>
