<!DOCTYPE html>
<html>
<head>
  <title>DigiBazar Fixed</title>
</head>

<body>

<h1>🛒 DigiBazar</h1>

<!-- AUTH -->
<div id="auth">

<h2>Login / Register</h2>

<input id="email" placeholder="Email"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>

<p id="msg"></p>

</div>

<!-- SHOP -->
<div id="shop" style="display:none;">

<h2>🛍️ Shop Area</h2>

<button onclick="logout()">Logout</button>

<hr>

<h3>➕ Add Product</h3>

<input id="name" placeholder="Product Name"><br><br>
<input id="price" placeholder="Price"><br><br>
<input type="file" id="image"><br><br>

<button onclick="addProduct()">Post Product</button>

<hr>

<h3>📦 Products</h3>
<div id="productList"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyBFRzWWY0iTPnPtmT_io6NNmxvmE9SZPwE",
  authDomain: "digibazar-48743.firebaseapp.com",
  projectId: "digibazar-48743",
  storageBucket: "digibazar-48743.firebasestorage.app",
  messagingSenderId: "295224613021",
  appId: "1:295224613021:web:4c1b41da57cb240c165c74"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// REGISTER
window.register = function(){

let email = emailInput();
let password = passInput();

createUserWithEmailAndPassword(auth,email,password)
.then(()=>{
showShop();
})
.catch(e=>alert(e.message));

}

// LOGIN
window.login = function(){

let email = emailInput();
let password = passInput();

signInWithEmailAndPassword(auth,email,password)
.then(()=>{
showShop();
loadProducts();
})
.catch(e=>alert(e.message));

}

// LOGOUT
window.logout = function(){
signOut(auth);
document.getElementById("auth").style.display="block";
document.getElementById("shop").style.display="none";
}

// ADD PRODUCT
window.addProduct = async function(){

let name = document.getElementById("name").value;
let price = document.getElementById("price").value;

await addDoc(collection(db,"products"),{
name:name,
price:price
});

loadProducts();

}

// LOAD PRODUCTS
window.loadProducts = async function(){

const snap = await getDocs(collection(db,"products"));

let html="";

snap.forEach(doc=>{
let d = doc.data();

html += `
<div style="border:1px solid #ccc;padding:10px;margin:10px;">
🛍️ ${d.name} <br>
💰 ${d.price}
</div>
`;

});

document.getElementById("productList").innerHTML = html;

}

// HELPERS
function emailInput(){
return document.getElementById("email").value;
}

function passInput(){
return document.getElementById("password").value;
}

function showShop(){
document.getElementById("auth").style.display="none";
document.getElementById("shop").style.display="block";
}

</script>

</body>
</html>
