 loadProducts(){
  const snap = await getDocs(collection(db,"products"));

  let html = "";

  snap.forEach(doc=>{
    let d = doc.data();

    html += `
      <div style="
        border:1px solid #ddd;
        padding:12px;
        margin:10px;
        border-radius:10px;
        background:#f9f9f9;
        width:200px;
        display:inline-block;
      ">
        <h3>🛍️ ${d.name}</h3>
        <p>💰 Price: ${d.price}</p>
      </div>
    `;
  });

  document.getElementById("productList").innerHTML = html;
}
