<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DigiBazar</title>

<style>
body{
  font-family:Arial;
  background:#f2f2f2;
  margin:0;
}

.header{
  background:green;
  color:white;
  text-align:center;
  padding:15px;
  font-size:22px;
  font-weight:bold;
}

.products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:10px;
}

.card{
  background:white;
  padding:10px;
  border-radius:10px;
  text-align:center;
}

.card img{
  width:100%;
  height:120px;
  border-radius:10px;
}

button{
  background:green;
  color:white;
  border:none;
  padding:8px;
  width:100%;
  border-radius:5px;
}
</style>

</head>

<body>

<div class="header">
  DigiBazar 🛒
</div>

<div class="products" id="list"></div>

<script>
// পুরোনো ডাটা লোড করা
let products = JSON.parse(localStorage.getItem("products")) || [];

// নতুন পণ্য দেখানো
function show(){
  let html = "";

  products.forEach((p)=>{
    html += `
      <div class="card">
        <img src="${p.img}">
        <h3>${p.name}</h3>
        <p>৳ ${p.price}</p>
        <button onclick="buy()">কিনুন</button>
      </div>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

function buy(){
  alert("আপনি এই পণ্য কিনতে চান 👍");
}

show();
</script>

</body>
</html><!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Seller Panel</title>

<style>
body{
  font-family:Arial;
  text-align:center;
  background:#f2f2f2;
}

.box{
  background:white;
  margin:20px;
  padding:20px;
  border-radius:10px;
}

input{
  width:90%;
  padding:10px;
  margin:5px;
}

button{
  background:green;
  color:white;
  border:none;
  padding:10px;
  width:95%;
}
</style>
</head>

<body>

<h2>Seller Panel</h2>

<div class="box">
  <input id="name" placeholder="পণ্যের নাম">
  <input id="price" placeholder="দাম">
  <input id="img" placeholder="ছবির লিংক">

  <button onclick="add()">Save Product</button>
</div>

<script>
function add(){
  let name = document.getElementById("name").value;
  let price = document.getElementById("price").value;
  let img = document.getElementById("img").value;

  let products = JSON.parse(localStorage.getItem("products")) || [];

  products.push({name,price,img});

  localStorage.setItem("products", JSON.stringify(products));

  alert("পণ্য সেভ হয়েছে 👍");
}
</script>

</body>
</html><!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DigiBazar Login</title>

<style>
body{
  font-family:Arial;
  text-align:center;
  padding-top:80px;
  background:#f2f2f2;
}

.box{
  background:white;
  margin:20px;
  padding:20px;
  border-radius:10px;
}

input, select{
  width:90%;
  padding:10px;
  margin:10px 0;
}

button{
  background:green;
  color:white;
  border:none;
  padding:10px;
  width:95%;
}
</style>
</head>

<body>

<div class="box">
  <h2>DigiBazar Login</h2>

  <input id="name" placeholder="আপনার নাম">

  <select id="type">
    <option value="buyer">Buyer</option>
    <option value="seller">Seller</option>
  </select>

  <button onclick="login()">Enter</button>
</div>

<script>
function login(){
  let name = document.getElementById("name").value;
  let type = document.getElementById("type").value;

  if(name == ""){
    alert("নাম লিখুন");
    return;
  }

  // save user info
  localStorage.setItem("user", name);
  localStorage.setItem("type", type);

  if(type == "buyer"){
    alert("স্বাগতম Buyer " + name);
    window.location.href = "index.html";
  } else {
    alert("স্বাগতম Seller " + name);
    window.location.href = "seller.html";
  }
}
</script>

</body>
</html><div style="text-align:center;background:white;padding:10px;">
  Welcome, <span id="user"></span>
</div>

<script>
document.getElementById("user").innerText = localStorage.getItem("user");
</script>
