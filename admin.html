<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DigiBazar Admin</title>

<style>
body{
  font-family:Arial;
  background:#f2f2f2;
  text-align:center;
}

.header{
  background:green;
  color:white;
  padding:15px;
  font-size:20px;
}

.box{
  background:white;
  margin:15px;
  padding:15px;
  border-radius:10px;
}

button{
  background:green;
  color:white;
  border:none;
  padding:10px;
  width:100%;
  margin-top:10px;
}

input{
  width:90%;
  padding:10px;
  margin:5px;
}
</style>
</head>

<body>

<div class="header">
  DigiBazar Admin Panel
</div>

<div class="box">
  <h3>নতুন পণ্য যোগ করুন</h3>

  <input type="text" id="name" placeholder="পণ্যের নাম">
  <input type="text" id="price" placeholder="দাম">
  <input type="text" id="img" placeholder="ছবির লিংক">

  <button onclick="addProduct()">Add Product</button>
</div>

<h3>সব পণ্য</h3>
<div id="products"></div>

<script>
function addProduct(){
  let name = document.getElementById("name").value;
  let price = document.getElementById("price").value;
  let img = document.getElementById("img").value;

  let item = `
    <div class="box">
      <img src="${img}" width="100%">
      <h3>${name}</h3>
      <p>৳ ${price}</p>
    </div>
  `;

  document.getElementById("products").innerHTML += item;

  alert("পণ্য যোগ হয়েছে 👍");
}
</script>

</body>
</html>
